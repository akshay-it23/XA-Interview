name: Continuous Deployment

# This tells GitHub to run this deployment pipeline ONLY when code is pushed to the 'main' branch.
# It won't run on Pull Requests.
on:
  push:
    branches: [ "main" ]

env:
  # The name of your image on Docker Hub
  IMAGE_NAME: your-dockerhub-username/interview-app

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

  deploy-to-server:
    name: Deploy to EC2 / Droplet
    needs: build-and-push
    runs-on: ubuntu-latest
    
    steps:
      - name: Execute SSH Commands on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          # You will need to add these secrets to your GitHub Repository Settings
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Pull the latest image we just pushed to Docker Hub
            docker pull ${{ env.IMAGE_NAME }}:latest
            
            # Stop the currently running container (if it exists)
            docker stop interview-app || true
            docker rm interview-app || true
            
            # Run the new container, passing the database URL from the server's environment
            docker run -d \
              --name interview-app \
              -p 3000:3000 \
              -e DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }} \
              -e NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }} \
              -e NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }} \
              ${{ env.IMAGE_NAME }}:latest
              
            # Clean up old unused images to save disk space
            docker image prune -f
