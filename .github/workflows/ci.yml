name: Continuous Integration

# This tells GitHub Actions to run this workflow whenever someone pushes code to the 'main' branch, 
# or opens a Pull Request to the 'main' branch.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the code from the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Step 3: Install all dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run the linter to catch syntax or styling errors
      - name: Run Linter
        run: npm run lint

      # Step 5: Check for TypeScript errors (type checking) without actually building
      - name: Run Type Checking
        run: npx tsc --noEmit

      # Step 6: Generate Prisma client (required before building)
      - name: Generate Prisma Client
        run: npx prisma generate

      # Step 7: Attempt to build the Next.js app to make sure it doesn't crash
      - name: Build Application
        run: npm run build
        env:
          # We provide dummy environment variables just so the build doesn't fail
          DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
          NEXTAUTH_SECRET: "dummy_secret"
          NEXTAUTH_URL: "http://localhost:3000"
